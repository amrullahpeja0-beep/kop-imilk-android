name: Build KOP-IMILK APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Extract project
        run: |
          rm -rf source
          mkdir -p source
          unzip -o KOP-IMILK-Android-Project.zip -d source || true
          ls -R source | head -n 100

      - name: Build APK
        run: |
          PROJECT_DIR=$(find source -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          echo "Project di: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Collect APK
        uses: actions/upload-artifact@v4
        with:
          name: KOP-IMILK-APK
          path: "**/build/outputs/apk/debug/*.apk"
